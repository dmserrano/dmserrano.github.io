<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#0b0f1a;font-family:'Inter',sans-serif;
       display:flex;flex-direction:column;justify-content:space-between;
       padding:80px;position:relative;overflow:hidden}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;
        background:radial-gradient(circle,rgba(96,165,250,0.20) 0%,rgba(34,211,238,0.07) 40%,transparent 70%);
        top:-420px;right:-300px}
  .rule{position:absolute;top:0;left:0;right:0;height:6px;
        background:linear-gradient(90deg,#60a5fa 0%,#22d3ee 100%)}
  .top{position:relative;z-index:1}
  .kicker{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;
          color:#22d3ee;letter-spacing:0.16em;text-transform:uppercase}
  h1{font-size:88px;font-weight:800;color:#f4f4f5;letter-spacing:-0.035em;
     line-height:1.02;margin-top:28px}
  p{font-size:31px;font-weight:400;color:#9ca3af;line-height:1.45;
    margin-top:30px;max-width:880px}
  .bottom{position:relative;z-index:1;display:flex;align-items:center;gap:18px}
  .dot{width:13px;height:13px;border-radius:50%;
       background:linear-gradient(135deg,#60a5fa,#22d3ee)}
  .domain{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:500;color:#d4d4d8}
</style></head>
<body>
  <div class="rule"></div><div class="glow"></div>
  <div class="top">
    <div class="kicker">Software Developer</div>
    <h1>Dominic Serrano</h1>
    <p>I get curious about something, build a small version of it, and usually learn more than I planned to.</p>
  </div>
  <div class="bottom"><div class="dot"></div><div class="domain">dominicserrano.com</div></div>
</body></html>
